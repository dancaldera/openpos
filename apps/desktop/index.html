<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPOS</title>
    <script>
      // Paint the saved theme on the very first frame, before any bundle loads:
      // the theme store keeps the mode, the palette and its colors in storage.
      ;(function () {
        var root = document.documentElement
        var mode = null
        var palette = 'classic'
        var colors = null
        try {
          var stored = localStorage.getItem('openpos-theme')
          if (stored === 'light' || stored === 'dark') mode = stored
          palette = localStorage.getItem('openpos-palette') || 'classic'
          colors = JSON.parse(localStorage.getItem('openpos-boot-colors') || 'null')
        } catch (error) {}
        if (!mode) {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.setAttribute('data-mode', mode)
        root.setAttribute('data-palette', palette)
        var current = colors && colors[mode]
        if (current && /^#[0-9a-f]{6}$/i.test(current.canvas || '') && /^#[0-9a-f]{6}$/i.test(current.accent || '')) {
          root.style.setProperty('--boot-canvas', current.canvas)
          root.style.setProperty('--boot-accent', current.accent)
        }
      })()
    </script>
    <style>
      html {
        color-scheme: light dark;
      }
      html[data-mode='light'] {
        color-scheme: light;
      }
      html[data-mode='dark'] {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      html,
      body {
        background: #f1f1f1;
        background: var(--boot-canvas, light-dark(#f1f1f1, #1b1b1b));
        color: #111111;
        color: light-dark(#111111, #f1f1f1);
      }
      /* Matches FullPageLoader, the React screen that replaces it. */
      #boot-splash {
        min-height: 100%;
        display: grid;
        place-items: center;
        place-content: center;
        text-align: center;
        gap: 0.75rem;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      #boot-splash span {
        width: 2rem;
        height: 2rem;
        border: 3px solid rgb(127 127 127 / 0.25);
        border-top-color: var(--boot-accent, currentColor);
        border-radius: 9999px;
        animation: boot-spin 0.8s linear infinite;
        display: inline-block;
        box-sizing: border-box;
      }
      #boot-splash button,
      #boot-splash p {
        display: none;
      }
      #boot-splash p {
        max-width: 22rem;
        opacity: 0.7;
        font-size: 0.95rem;
      }
      #boot-splash button {
        margin-top: 0.5rem;
        padding: 0.55rem 1rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      #boot-splash.is-slow p,
      #boot-splash.is-slow button {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash span {
          animation-duration: 2.4s;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" aria-live="polite" aria-label="Loading">
        <span aria-hidden="true"></span>
        <p>Still starting up. If this screen stays blank, reload.</p>
        <button type="button" id="boot-reload">Reload</button>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('boot-splash')
        var reloadButton = document.getElementById('boot-reload')
        if (reloadButton) {
          reloadButton.addEventListener('click', function () {
            location.reload()
          })
        }
        setTimeout(function () {
          if (splash && document.body.contains(splash)) {
            splash.className += ' is-slow'
          }
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
